name: classroom
description: Automated on-device classroom attendance system using face detection and recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Camera
  camera: ^0.10.5
  sensors_plus: ^7.1.0

  # Native engine (native/) — detection, embedding, clustering, roster
  # matching, and the roster DB all run in C++, called via dart:ffi. See
  # lib/native/.
  ffi: ^2.2.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Utilities
  permission_handler: ^11.3.1     # Camera permissions
  share_plus: ^10.1.4              # Export attendance results as CSV

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
