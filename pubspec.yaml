name: classroom
description: Automated on-device classroom attendance system using face detection and recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Camera & Media
  camera: ^0.11.0+2
  video_player: ^2.9.2
  image: ^4.3.0

  # Computer Vision (OpenCV)
  opencv_dart: ^1.3.0

  # ML Inference
  flutter_onnxruntime: ^2.4.0     # YuNet + ArcFace ONNX inference with NNAPI
  tflite_flutter: ^0.11.0         # YOLOv8-face TFLite inference (benchmark)

  # Local Database
  sqflite: ^2.4.1                 # Roster embedding storage (SQLite)
  path: ^1.9.0
  path_provider: ^2.1.5

  # Data Export
  csv: ^6.0.0                     # CSV attendance export
  share_plus: ^10.1.4             # Share CSV via system share sheet

  # State Management
  provider: ^6.1.2

  # Utilities
  permission_handler: ^11.3.1     # Camera/storage permissions
  uuid: ^4.5.1                    # Unique IDs for detections/clusters
  collection: ^1.19.0             # Advanced collection utilities
  intl: ^0.19.0                   # Date/time formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
