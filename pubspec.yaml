name: classroom
description: Automated on-device classroom attendance system using face detection and recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.9
  # No google_fonts: it fetches font files over the network at runtime,
  # which contradicts this project's offline-only design (see app.dart).

  # Camera & Media
  camera: ^0.12.0+2
  video_player: ^2.14.0
  image: ^4.9.2

  # Computer Vision (OpenCV)
  opencv_dart: ^2.2.2

  # ML Inference
  flutter_onnxruntime: ^1.8.3     # YuNet + RetinaFace + ArcFace ONNX inference with NNAPI
                                   # (Haar Cascade baseline runs via opencv_dart, no separate runtime needed)

  # Local Database
  sqflite: ^2.4.3                 # Roster embedding storage (SQLite)
  path: ^1.9.1
  path_provider: ^2.1.6

  # Data Export
  csv: ^8.0.0                     # CSV attendance export
  share_plus: ^13.3.0             # Share CSV via system share sheet

  # State Management
  provider: ^6.1.5+1

  # Utilities
  permission_handler: ^13.0.1     # Camera/storage permissions
  uuid: ^4.6.0                    # Unique IDs for detections/clusters
  collection: ^1.19.1             # Advanced collection utilities
  intl: ^0.20.3                   # Date/time formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/

# opencv_dart (dartcv4) only compiles imgcodecs/imgproc by default — everything
# else (including objdetect, needed for FaceDetectorYN/CascadeClassifier, and
# videoio, needed for VideoCapture) is excluded by default to keep binary size
# down. Explicitly opt in to what this app actually uses. Discovered the hard
# way: without this, cv.FaceDetectorYN throws "symbol not found" at runtime
# on-device (works fine in `flutter analyze` since it's a native linking
# issue, not a Dart compile error).
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - objdetect  # FaceDetectorYN (YuNet/RetinaFace helpers), CascadeClassifier (Haar)
        - dnn        # FaceDetectorYN is itself built on cv::dnn internally — required, not optional
        - videoio    # VideoCapture, used by frame_sampler.dart
        - calib3d    # findHomography, for Module 2's motion compensation
        - features2d # ORB, for Module 2's motion compensation
