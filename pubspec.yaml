name: classroom
description: Automated on-device classroom attendance system using face detection and recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Camera & Sensors
  camera: ^0.10.5
  sensors_plus: ^7.1.0

  # Computer Vision & Inference (Android / Multi-platform)
  opencv_dart: ^2.2.2
  flutter_onnxruntime: ^1.8.3
  image: ^4.2.0

  # Storage & Utilities
  sqflite: ^2.4.3
  ffi: ^2.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  collection: ^1.19.0
  intl: ^0.19.0

  # Utilities
  permission_handler: ^11.3.1     # Camera permissions
  share_plus: ^10.1.4              # Export attendance results as CSV

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - objdetect
        - dnn
        - videoio
        - calib3d
        - features2d
